<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rizz Lines</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;line-height:1.5;padding:32px;background:#0f172a;color:#e6eef8}
    .card{background:#071029;padding:20px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,.6);max-width:900px;margin:0 auto}
    h1{font-size:20px;margin:0 0 12px}
    pre{white-space:pre-wrap;background:#021025;padding:12px;border-radius:8px;overflow:auto}
    .btn{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:8px;background:#2563eb;color:white;text-decoration:none}
    footer{margin-top:16px;color:#9fb0d6;font-size:13px}
  </style>
</head>

<body>
  <div class="card">
    <h1>Rizz Lines — Preview</h1>
    <pre id="preview">Loading...</pre>
    <a id="rawlink" class="btn" href="#" target="_blank">Open raw file</a>
    <footer>Make sure rizz.txt is in the same folder as this file.</footer>
  </div>

  <script>
    const rawPath = './rizz.txt';
    fetch(rawPath).then(r => r.text()).then(t => {
      const lines = t.replace(/\r?\n|\r/g, '').split('|');
      document.getElementById('preview').textContent = lines.join('\n\n');
      document.getElementById('rawlink').href = rawPath;
    }).catch(e => {
      document.getElementById('preview').textContent = 'Could not load rizz.txt — check file path or hosting.';
      document.getElementById('rawlink').style.display = 'none';
    });
  </script>
</body>


</html>
